# Optional override: swaps the `l1` service for QBFT Besu (same name/port/alias). Layer it in:
#   docker compose -f docker-compose-deps.yaml -f docker-compose-besu.yaml up            # deps
#   docker compose -f docker-compose.yaml -f docker-compose-e2e.yaml -f docker-compose-besu.yaml up  # e2e
services:
  besu-genesis:
    image: node:22-slim
    volumes:
      - ./dev/zksyncos/l1-state.json.gz:/input/l1-state.json.gz:ro
      - ./dev/zksyncos/besu/generate-besu-genesis.mjs:/app/generate-besu-genesis.mjs:ro
      - besu_config:/besu-config
    command: node /app/generate-besu-genesis.mjs /input/l1-state.json.gz /besu-config/besu-network-config.json

  # Replays the L1 deployment, writes the replay-done marker, then stays up (health-checked on the
  # marker) so `up --wait` treats it as ready. Idempotent.
  besu-deploy:
    image: node:22-slim
    restart: unless-stopped
    volumes:
      - ./dev/zksyncos/l1-state.json.gz:/input/l1-state.json.gz:ro
      - ./dev/zksyncos/besu/replay-l1-deployment.mjs:/app/replay-l1-deployment.mjs:ro
      - besu_config:/besu-config
    command: >
      bash -c "if [ ! -f /besu-config/replay-done ]; then
      node /app/replay-l1-deployment.mjs /input/l1-state.json.gz http://l1:5010 &&
      touch /besu-config/replay-done; fi && exec sleep infinity"
    healthcheck:
      test: ['CMD-SHELL', 'test -f /besu-config/replay-done']
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 15s
    depends_on:
      l1:
        condition: service_started

  l1:
    image: hyperledger/besu:26.7.0
    restart: unless-stopped
    entrypoint: ''
    command: bash /besu/entrypoint.sh
    volumes: !override
      - besu_config:/besu-config:ro
      - besu_data:/besu-data
      - ./dev/zksyncos/besu/entrypoint.sh:/besu/entrypoint.sh:ro
    depends_on:
      besu-genesis:
        condition: service_completed_successfully
    healthcheck:
      # Healthy once RPC is up AND replay finished (marker), so `depends_on: l1 healthy` waits for it.
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5010' && test -f /besu-config/replay-done"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s

volumes:
  besu_config:
  besu_data:
