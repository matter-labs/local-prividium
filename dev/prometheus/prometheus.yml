global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: prividium-api
    static_configs:
      - targets: ["prividium-api:9091"]
        labels:
          service: prividium-api

  - job_name: operator-balances
    static_configs:
      - targets: ["operator-balance-exporter:9102"]
        labels:
          service: operator-balance-exporter
