services:
  sso-funds:
    profiles: [sso]
    build:
      context: ./dev/bundler/contracts
      dockerfile: Dockerfile
      target: bridge-funds
    image: local/prividium-bridge-funds:v1.276.0-sandbox.1
    environment:
      L1_RPC_URL: ${SEPOLIA_RPC_URL}
      L2_RPC_URL: http://zksyncos:3050
      L2_CHAIN_ID: ${L2_CHAIN_ID}
      PRIVATE_KEYS: ${BUNDLER_PRIVATE_KEY:-},${ENTRYPOINT_DEPLOYER_PRIVATE_KEY:-},${SSO_DEPLOYER_PRIVATE_KEY:-},${AUTH_SERVER_PRIVATE_KEY:-},${AUTH_SERVER_ADMIN_PRIVATE_KEY:-}
      BRIDGE_SPONSOR_PRIVATE_KEY: ${BRIDGE_SPONSOR_PRIVATE_KEY:-}
      TARGET_L2_BALANCE_ETH: ${SERVICE_WALLET_TARGET_L2_ETH:-0.05}
    depends_on:
      zksyncos:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  entrypoint-deployer:
    profiles: [sso]
    build:
      context: ./dev/bundler/contracts
      dockerfile: Dockerfile
      target: entrypoint
    image: local/prividium-entrypoint-deployer:v1.276.0-sandbox.1
    environment:
      RPC_URL: http://zksyncos:3050
      PRIVATE_KEY: ${ENTRYPOINT_DEPLOYER_PRIVATE_KEY:-}
      FACTORY_DEPLOYER_FUNDING_ETH: ${FACTORY_DEPLOYER_FUNDING_ETH:-0.012}
    depends_on:
      sso-funds:
        condition: service_completed_successfully
    networks:
      - app
    restart: "no"

  bundler:
    profiles: [sso]
    image: quay.io/matterlabs_enterprise/prividium-bundler:v1.276.0@sha256:cacb276a24a709bf93155e2b53a78099d07f560e94edbada359aaae28aac1462
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BUNDLER_PORT: "4337"
      SEQUENCER_RPC_URL: http://zksyncos:3050
      BUNDLER_EXECUTOR_PRIVATE_KEYS: ${BUNDLER_PRIVATE_KEY:-}
      BUNDLER_UTILITY_PRIVATE_KEY: ${BUNDLER_PRIVATE_KEY:-}
      BUNDLER_ENTRYPOINTS: 0x4337084D9E255Ff0702461CF8895CE9E3b5Ff108
      BUNDLER_MIN_BALANCE: "10000000000000000"
      BUNDLER_NETWORK_NAME: prividium-sandbox
      BUNDLER_LOG_LEVEL: info
    depends_on:
      entrypoint-deployer:
        condition: service_completed_successfully
    networks:
      - app

  sso-runtime-init:
    profiles: [sso]
    image: local/prividium-sso-setup:v1.276.0-sandbox.1
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      chown -R node:node /runtime
      chmod 0750 /runtime
    volumes:
      - sso_runtime:/runtime
    restart: "no"

  contracts-extractor:
    profiles: [sso]
    image: ghcr.io/matter-labs/sso-auth-server-api:996fbd7-1780065236920@sha256:3cca950a30fe121a98adce91bbc2f943e0169281b571e0c5902aee022a68cc42
    platform: linux/amd64
    volumes:
      - sso_runtime:/runtime
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      if [ -d /prod/auth-server-api/contracts ]; then
        mkdir -p /runtime/contracts
        cp -R /prod/auth-server-api/contracts/. /runtime/contracts/
      elif [ ! -f /runtime/contracts/WebAuthnValidator.sol/WebAuthnValidator.json ]; then
        echo "SSO contract artifacts are unavailable in the pinned image" >&2
        exit 1
      fi
    depends_on:
      sso-runtime-init:
        condition: service_completed_successfully
    restart: "no"

  sso-contracts-deployer:
    profiles: [sso]
    build:
      context: ./dev/sso-setup
      dockerfile: Dockerfile
    image: local/prividium-sso-setup:v1.276.0-sandbox.1
    environment:
      RPC_URL: http://zksyncos:3050
      CHAIN_ID: ${L2_CHAIN_ID}
      CHAIN_NAME: ${CHAIN_NAME:-Prividium Sandbox}
      DEPLOYER_PRIVATE_KEY: ${SSO_DEPLOYER_PRIVATE_KEY:-}
      CONTRACTS_ENV_PATH: /runtime/contracts.env
      CONTRACTS_DIR: /runtime/contracts
      ENTRY_POINT_ADDRESS: 0x4337084D9E255Ff0702461CF8895CE9E3b5Ff108
      SSO_CLIENT_ID: sso-sandbox-client
      MIN_L2_BALANCE_WEI: "10000000000000000"
    command: ["node", "--import", "tsx", "scripts/deploy-contracts.ts"]
    volumes:
      - sso_runtime:/runtime
    depends_on:
      entrypoint-deployer:
        condition: service_completed_successfully
      contracts-extractor:
        condition: service_completed_successfully
    networks:
      - app
    restart: "no"

  auth-server-api:
    profiles: [sso]
    image: ghcr.io/matter-labs/sso-auth-server-api:996fbd7-1780065236920@sha256:3cca950a30fe121a98adce91bbc2f943e0169281b571e0c5902aee022a68cc42
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - sso_runtime:/runtime:ro
    environment:
      PORT: "3004"
      CORS_ORIGINS: https://auth.${SANDBOX_DOMAIN},https://app.${SANDBOX_DOMAIN},https://admin.${SANDBOX_DOMAIN}
      DEPLOYER_PRIVATE_KEY: ${AUTH_SERVER_PRIVATE_KEY:-}
      RPC_URL: http://zksyncos:3050
      CHAIN_1_ID: ${L2_CHAIN_ID}
      CHAIN_1_RPC_URL: http://zksyncos:3050
      PRIVIDIUM_MODE: "true"
      PRIVIDIUM_API_URL: http://prividium-api:8000
      PRIVIDIUM_ADMIN_PRIVATE_KEY: ${AUTH_SERVER_ADMIN_PRIVATE_KEY:-}
      PRIVIDIUM_TEMPLATE_KEY: sso-smart-account
      SSO_AUTH_SERVER_BASE_URL: https://auth.${SANDBOX_DOMAIN}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      test -s /runtime/contracts.env
      set -a
      . /runtime/contracts.env
      set +a
      exec node --experimental-wasm-modules /prod/auth-server-api/dist/index.js
    depends_on:
      sso-permissions-setup:
        condition: service_completed_successfully
    networks:
      - app

  auth-server:
    profiles: [sso]
    image: ghcr.io/matter-labs/sso-auth-server:996fbd7-1780065232708@sha256:f2685b559c9a0a96e2663485d9e28221b46871e75e7d012c824c2d703e55e39f
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - sso_runtime:/runtime:ro
    environment:
      NUXT_PUBLIC_CHAIN_ID: ${L2_CHAIN_ID}
      NUXT_PUBLIC_CHAIN_NAME: ${CHAIN_NAME:-Prividium Sandbox}
      NUXT_PUBLIC_CHAIN_RPC_URL: https://api.${SANDBOX_DOMAIN}/rpc
      NUXT_PUBLIC_AUTH_SERVER_API_URL: https://auth-api.${SANDBOX_DOMAIN}
      NUXT_PUBLIC_PRIVIDIUM_MODE: "true"
      NUXT_PUBLIC_PRIVIDIUM_AUTH_BASE_URL: https://app.${SANDBOX_DOMAIN}
      NUXT_PUBLIC_PRIVIDIUM_API_BASE_URL: https://api.${SANDBOX_DOMAIN}
      NUXT_PUBLIC_SALT_SERVICE_URL: https://sso-oidc.zksync.dev/salt
      NUXT_PUBLIC_ZKEY_URL: https://sso-oidc.zksync.dev/zkey
      NUXT_PUBLIC_WITNESS_WASM_URL: https://sso-oidc.zksync.dev/witness
    command: >
      sh -ec "
        test -s /runtime/contracts.env;
        set -a;
        . /runtime/contracts.env;
        set +a;
        export NUXT_PUBLIC_PRIVIDIUM_CLIENT_ID=\"$${SSO_CLIENT_ID}\";
        export NUXT_PUBLIC_GUARDIAN_EXECUTOR_ADDRESS=\"$${SSO_GUARDIAN_EXECUTOR}\";
        export NUXT_PUBLIC_FACTORY_ADDRESS=\"$${SSO_FACTORY}\";
        export NUXT_PUBLIC_EOA_VALIDATOR_ADDRESS=\"$${SSO_EOA_VALIDATOR}\";
        export NUXT_PUBLIC_WEBAUTHN_VALIDATOR_ADDRESS=\"$${SSO_WEBAUTHN_VALIDATOR}\";
        export NUXT_PUBLIC_SESSION_VALIDATOR_ADDRESS=\"$${SSO_SESSION_VALIDATOR}\";
        export NUXT_PUBLIC_BEACON_ADDRESS=\"$${SSO_BEACON}\";
        export NUXT_PUBLIC_ENTRY_POINT_ADDRESS=\"$${SSO_ENTRY_POINT}\";
        exec node .output/server/index.mjs
      "
    depends_on:
      sso-permissions-setup:
        condition: service_completed_successfully
      auth-server-api:
        condition: service_started
    networks:
      - app

  zksync-webhook-service:
    profiles: [webhook]
    image: quay.io/matterlabs_enterprise/webhook-service:v0.1.28@sha256:8f87060a3513ca7a53c1182da98c13ba1637f8b77695cec71a0ae515a714f23c
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${WEBHOOK_DB_NAME:-zksync_webhook_db}
      DATABASE_USER: ${WEBHOOK_DB_USER}
      DATABASE_PASSWORD: ${WEBHOOK_DB_PASSWORD}
      DATABASE_ENABLE_SSL: "false"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
      ZKSYNC_WEBHOOK_CONFIG: /app/config/config.default.toml
      RUST_LOG: info
      ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      ENCRYPTION_KDF_SALT: ${WEBHOOK_ENCRYPTION_KDF_SALT:-}
      PRIVIDIUM_API_KEY: ${WEBHOOK_PRIVIDIUM_API_KEY:-}
      PRIVIDIUM_RPC_URL: http://prividium-api:8000/rpc
      PRIVIDIUM_PERMISSIONS_API: http://prividium-api:8000
      ZKSYNC_WEBHOOK_API_CORS_ALLOW_ORIGIN: https://admin.${SANDBOX_DOMAIN}
      ZKSYNC_WEBHOOK_ALLOW_HTTP_LOCALHOST: "false"
      ZKSYNC_WEBHOOK_CHAIN_NAME: prividium_sandbox
      ZKSYNC_WEBHOOK_CHAIN_ID: ${L2_CHAIN_ID}
    depends_on:
      postgres:
        condition: service_healthy
      webhook-permissions-setup:
        condition: service_completed_successfully
    networks:
      - app
      - data
