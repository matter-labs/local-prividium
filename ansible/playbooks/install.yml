---
- name: Validate the Prividium installation inventory boundary
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require exactly one dedicated Prividium host
      ansible.builtin.assert:
        that:
          - groups['all'] | default([]) | length == 1
          - groups['prividium'] | default([]) | length == 1
        fail_msg: >-
          Installation requires an inventory containing exactly one host in
          the prividium group.
        success_msg: Inventory contains exactly one Prividium target.

- name: Provision the Prividium evaluation host
  hosts: prividium
  gather_facts: true
  become: false
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Inspect the Ansible installation marker
      ansible.builtin.stat:
        path: /etc/prividium/.host-install-managed
        follow: false
      register: prividium_install_marker_path

    - name: Revalidate the host immediately before installation
      ansible.builtin.include_role:
        name: host_preflight
      vars:
        host_preflight_allow_existing_runtime: >-
          {{
            prividium_install_marker_path.stat.isreg | default(false)
            and
            prividium_install_marker_path.stat.pw_name | default('') == 'root'
            and
            prividium_install_marker_path.stat.mode | default('') == '0644'
          }}

  roles:
    - role: host_packages
      become: true
    - role: host_security
      become: true
    - role: prividium_tools
      become: true
    - role: container_runtime
      become: true
    - role: prividium_config
      become: true

  post_tasks:
    - name: Inspect whether the host requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
        follow: false
      register: prividium_install_reboot_required

    - name: Report installation completion
      ansible.builtin.debug:
        msg:
          - Host provisioning converged successfully.
          - >-
            reboot_required={{
              prividium_install_reboot_required.stat.exists
            }}
          - >-
            Reconnect the operator session before running application commands
            so Docker group membership is active.
          - >-
            Firewall activation, SSH changes, provider rules, Quay
            authentication, and application deployment were not performed.
      when: not ansible_check_mode

    - name: Report installation plan completion
      ansible.builtin.debug:
        msg: >-
          INSTALLATION PLAN COMPLETE. Check mode made no host changes. Review
          the predicted package, repository, tool, Docker, and directory
          changes above before applying them.
      when: ansible_check_mode
