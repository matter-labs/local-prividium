---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Inspect the protected runtime directory
  ansible.builtin.stat:
    path: "{{ prividium_runtime_dir }}"
    follow: false
  register: verification_runtime_path

- name: Inspect the root Prividium directory
  ansible.builtin.stat:
    path: /etc/prividium
    follow: false
  register: verification_root_path

- name: Inspect the Ansible installation marker
  ansible.builtin.stat:
    path: /etc/prividium/.host-install-managed
    follow: false
  register: verification_install_marker_path

- name: Inspect the Docker daemon configuration path
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
    follow: false
  register: verification_docker_configuration_path

- name: Inspect the Docker daemon configuration
  ansible.builtin.slurp:
    path: /etc/docker/daemon.json
  register: verification_docker_configuration

- name: Inspect the periodic upgrade policy
  ansible.builtin.slurp:
    path: /etc/apt/apt.conf.d/21prividium-auto-upgrades
  register: verification_periodic_upgrade_policy

- name: Inspect the unattended reboot policy
  ansible.builtin.slurp:
    path: /etc/apt/apt.conf.d/99prividium-unattended-upgrades
  register: verification_unattended_reboot_policy

- name: Inspect Docker group membership
  ansible.builtin.getent:
    database: group
    key: docker

- name: Inspect Docker daemon readiness
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{{ '{{json .ServerVersion}}' }}"
  changed_when: false
  check_mode: false

- name: Inspect Docker Compose
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
      - --short
  changed_when: false
  check_mode: false

- name: Inspect SOPS
  ansible.builtin.command:
    argv:
      - sops
      - --version
  changed_when: false
  check_mode: false
  register: verification_sops

- name: Inspect age
  ansible.builtin.command:
    argv:
      - age
      - --version
  changed_when: false
  check_mode: false

- name: Inspect Foundry Cast
  ansible.builtin.command:
    argv:
      - cast
      - --version
  changed_when: false
  check_mode: false
  register: verification_cast

- name: Verify automatic apt maintenance timers are enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ item }}"
  changed_when: false
  check_mode: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Verify automatic apt maintenance timers are active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item }}"
  changed_when: false
  check_mode: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Inspect whether the host requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
    follow: false
  register: verification_reboot_required

- name: Decode the Docker daemon configuration
  ansible.builtin.set_fact:
    verification_docker_configuration_document: >-
      {{
        verification_docker_configuration.content
        | b64decode
        | from_json
      }}
    verification_missing_packages: >-
      {{
        verification_required_packages
        | difference(ansible_facts.packages.keys() | list)
        | sort
      }}

- name: Enforce the installed host contract
  ansible.builtin.assert:
    that:
      - verification_missing_packages | length == 0
      - >-
        ansible_facts.services.get('docker.service', {}).get('state')
        == 'running'
      - >-
        ansible_facts.services.get('docker.service', {}).get('status')
        == 'enabled'
      - >-
        ansible_facts.services.get('chrony.service', {}).get('state')
        == 'running'
      - >-
        ansible_facts.services.get('chrony.service', {}).get('status')
        == 'enabled'
      - >-
        ansible_facts.services.get(
          'unattended-upgrades.service',
          {}
        ).get('state') == 'running'
      - >-
        ansible_facts.services.get(
          'unattended-upgrades.service',
          {}
        ).get('status') == 'enabled'
      - prividium_operator_user in ansible_facts.getent_group['docker'][2].split(',')
      - verification_root_path.stat.isdir | default(false)
      - verification_root_path.stat.pw_name | default('') == 'root'
      - verification_root_path.stat.gr_name | default('') == 'root'
      - verification_root_path.stat.mode | default('') == '0755'
      - verification_install_marker_path.stat.isreg | default(false)
      - verification_install_marker_path.stat.pw_name | default('') == 'root'
      - verification_install_marker_path.stat.gr_name | default('') == 'root'
      - verification_install_marker_path.stat.mode | default('') == '0644'
      - verification_runtime_path.stat.isdir | default(false)
      - >-
        verification_runtime_path.stat.pw_name | default('')
        == prividium_operator_user
      - verification_runtime_path.stat.gr_name | default('') == 'root'
      - verification_runtime_path.stat.mode | default('') == '0700'
      - verification_docker_configuration_path.stat.isreg | default(false)
      - not verification_docker_configuration_path.stat.islnk | default(false)
      - >-
        verification_docker_configuration_path.stat.pw_name | default('')
        == 'root'
      - >-
        verification_docker_configuration_path.stat.gr_name | default('')
        == 'root'
      - >-
        verification_docker_configuration_path.stat.mode | default('')
        == '0644'
      - verification_docker_configuration_document['log-driver'] == 'json-file'
      - >-
        verification_docker_configuration_document['log-opts']['max-size']
        == '10m'
      - >-
        verification_docker_configuration_document['log-opts']['max-file']
        == '3'
      - verification_expected_sops_version in verification_sops.stdout
      - verification_expected_foundry_version in verification_cast.stdout
      - >-
        'APT::Periodic::Unattended-Upgrade "1";' in
        (
          verification_periodic_upgrade_policy.content
          | b64decode
        )
      - >-
        'Unattended-Upgrade::Automatic-Reboot "false";' in
        (
          verification_unattended_reboot_policy.content
          | b64decode
        )
    fail_msg: >-
      Host installation verification failed. Review missing packages, service
      state, operator Docker membership, protected directory ownership,
      bounded-log configuration, or pinned tool versions.
    success_msg: >-
      HOST INSTALLATION VERIFIED. Packages, tools, Docker, services, operator
      membership, and protected directories match the evaluation contract.

- name: Report remaining customer-controlled actions
  ansible.builtin.debug:
    msg:
      reboot_required: "{{ verification_reboot_required.stat.exists }}"
      remaining_actions:
        - >-
          Configure and externally verify the provider firewall before
          application deployment.
        - Authenticate to Quay manually with a pull-only credential.
