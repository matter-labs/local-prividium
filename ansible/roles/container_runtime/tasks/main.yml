---
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: "{{ container_runtime_docker_signing_key_checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: container_runtime_docker_signing_key_state

- name: Configure the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "{{ container_runtime_docker_repository_url }}"
    suites:
      - "{{ container_runtime_docker_repository_suite }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: container_runtime_docker_repository_state
  when: not ansible_check_mode

- name: Refresh the package index for Docker
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: >-
      {{
        0
        if (
          container_runtime_docker_repository_state.changed
          or container_runtime_docker_signing_key_state.changed
        )
        else container_runtime_cache_valid_time_seconds
      }}
  when: not ansible_check_mode

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ container_runtime_packages }}"
    state: present
  when: not ansible_check_mode

- name: Inspect the existing Docker daemon configuration
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
    follow: false
  register: container_runtime_docker_configuration_path
  when: not ansible_check_mode

- name: Reject a symbolic-link Docker daemon configuration
  ansible.builtin.assert:
    that:
      - not container_runtime_docker_configuration_path.stat.islnk
    fail_msg: >-
      Refusing to manage a symbolic-link /etc/docker/daemon.json file.
  when:
    - not ansible_check_mode
    - container_runtime_docker_configuration_path.stat.exists

- name: Read the existing Docker daemon configuration
  ansible.builtin.slurp:
    path: /etc/docker/daemon.json
  register: container_runtime_docker_configuration_raw
  when:
    - not ansible_check_mode
    - container_runtime_docker_configuration_path.stat.exists

- name: Derive the merged Docker daemon configuration
  ansible.builtin.set_fact:
    container_runtime_docker_configuration: >-
      {{
        (
          (
            container_runtime_docker_configuration_raw
            | default({})
          ).content
          | default('e30=')
          | b64decode
          | from_json
        )
        | combine(
            {
              'log-driver': container_runtime_log_driver,
              'log-opts': {
                'max-size': container_runtime_log_max_size,
                'max-file': container_runtime_log_max_files
              }
            },
            recursive=true
          )
      }}
  when: not ansible_check_mode

- name: Configure bounded Docker container logs
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{
        container_runtime_docker_configuration
        | to_nice_json(indent=2)
      }}
  notify: Restart Docker
  when: not ansible_check_mode

- name: Add the deployment operator to the Docker group
  ansible.builtin.user:
    name: "{{ prividium_operator_user }}"
    groups:
      - docker
    append: true
  when: not ansible_check_mode

- name: Enable Docker Engine
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Report Docker changes in check mode
  ansible.builtin.debug:
    msg: >-
      Apply will configure Docker's official deb822 Ubuntu repository, install
      Docker Engine, Buildx, and Compose, configure bounded logs, enable the
      service, and add {{ prividium_operator_user }} to the docker group.
  when: ansible_check_mode
