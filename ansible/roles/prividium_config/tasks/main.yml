---
- name: Create the root-owned Prividium configuration directory
  ansible.builtin.file:
    path: /etc/prividium
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Record Ansible ownership of the host installation
  ansible.builtin.copy:
    dest: "{{ prividium_config_install_marker }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      managed_by=prividium-host-install
  when: not ansible_check_mode

- name: Create the protected runtime directory
  ansible.builtin.file:
    path: "{{ prividium_runtime_dir }}"
    state: directory
    owner: "{{ prividium_operator_user }}"
    group: root
    mode: "0700"
  when: not ansible_check_mode

- name: Report protected directory changes in check mode
  ansible.builtin.debug:
    msg: >-
      Apply will create root-owned /etc/prividium, its installation marker,
      and operator-owned {{ prividium_runtime_dir }} with mode 0700.
  when: ansible_check_mode
