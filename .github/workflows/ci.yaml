name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['main']

jobs:
  validate-sandbox:
    name: Validate sandbox definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt

      - name: Check Rust CLI
        run: |
          cargo +1.90.0 fmt --all --check
          cargo +1.90.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.90.0 test --workspace --locked

      - name: Check retained shell assets
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -Eq '^#!.*bash'; then
              bash -n "$file"
            fi
          done < <(find tools dev tests -type f -print0)

      - name: Validate focused deployment UX
        run: |
          tests/skill-discovery.sh

      - name: Render and validate every Compose profile
        run: tools/validate-stack deployment/sandbox.env.example
