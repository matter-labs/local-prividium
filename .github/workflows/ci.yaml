name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['main']

jobs:
  validate-sandbox:
    name: Validate sandbox definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -Eq '^#!.*bash'; then
              bash -n "$file"
            fi
          done < <(find cli tools dev tests -type f -print0)
          ./cli/prividium host operator create --help >/dev/null
          ./cli/prividium host bootstrap --help >/dev/null
          ./cli/prividium host preflight --help >/dev/null
          ./cli/prividium host install --help >/dev/null
          ./cli/prividium host verify --help >/dev/null
          ./cli/prividium init --help >/dev/null
          ./cli/prividium credentials --help >/dev/null

      - name: Validate focused deployment UX
        run: |
          tests/host-operator.sh
          tests/host-backend.sh
          tests/input-env.sh
          tests/skill-discovery.sh

      - name: Render and validate every Compose profile
        run: tools/validate-stack deployment/sandbox.env.example
