name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['main']

jobs:
  validate-sandbox:
    name: Validate sandbox definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        shell: bash
        run: |
          find tools dev -type f \( -name '*.sh' -o -path 'tools/*' \) -print0 |
            xargs -0 bash -n

      - name: Render and validate every Compose profile
        run: tools/validate-stack --allow-unbenchmarked deployment/sandbox.env.example
