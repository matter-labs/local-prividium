name: zksync-prividium

include:
  - docker-compose-deps.yaml
  - docker-compose-examples.yaml

services:
  admin-panel:
    image: quay.io/matterlabs_enterprise/prividium-adminv2:v1.237.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - VITE_PRIVIDIUM_API_URL=http://localhost:8000
      - VITE_USER_PANEL_URL=http://localhost:3001
      - VITE_EXPLORER_URL=http://localhost:3010
      - VITE_DISCLOSURE_METHODS_ENABLED=true
      - VITE_FAUCET_ENABLED=true
      - VITE_TENANTS_ENABLED=false
      - PORT=3000
    depends_on:
      - prividium-api
      - user-panel
    ports:
      - '3000:3000'

  prividium-api:
    image: quay.io/matterlabs_enterprise/prividium-permissions-api:v1.237.0
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      zksyncos:
        condition: service_started
      bundler:
        condition: service_started
      sso-contracts-deployer:
        condition: service_completed_successfully
    ports:
      - '8000:8000'
      - '9091:9091'
    env_file:
      - path: ./dev/sso-setup/contracts.env
        required: false
    environment:
      - PORT=8000
      - METRICS_PORT=9091
      - SEQUENCER_RPC_URL=http://zksyncos:3050
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3006,http://localhost:3500
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/prividium_api
      - AUTH_METHODS=oidc,crypto_native
      - NODE_ENV=production
      - SIWE_CHAIN_ID=6565
      - SIWE_VALID_DOMAINS=localhost:3000,localhost:3001,localhost:3006,localhost:3500
      - SIWE_HMAC_SECRET=aaaaaaaa00000000aaaaaaaa00000000aaaaaaaa00000000aaaaaaaa00000000
      - SIWE_CHALLENGE_RATE_LIMIT_COUNT=1000
      - SIWE_CHALLENGE_RATE_LIMIT_WINDOW_SECONDS=300
      - SIWE_CONSUMED_NONCE_TTL_SECONDS=600
      - SIWE_CLEANUP_INTERVAL_SECONDS=60
      - SIWE_CHALLENGE_RATE_LIMIT_BYPASS_IPS=127.0.0.1,::1
      - DEPLOYMENT_PENDING_TTL_SECONDS=3600
      - DEPLOYMENT_ERRORED_RETENTION_SECONDS=604800
      - DEPLOYMENT_CLEANUP_INTERVAL_SECONDS=300
      - OIDC_JWKS_URI=http://keycloak:8080/realms/prividium/protocol/openid-connect/certs
      - OIDC_JWT_AUD=prividium-client
      - OIDC_JWT_ISSUER=http://localhost:5080/realms/prividium
      - OIDC_ADMIN_SUBS=00000000-0000-0000-0000-000000000001
      - CORS_CACHE_DURATION_MS=60000
      - ADMIN_PANEL_REDIRECT_URLS=http://localhost:3000/callback
      - BLOCK_EXPLORER_REDIRECT_URLS=http://localhost:3010/auth/callback
      - SWAGGER_UI_ALLOWED_ROLES=admin
      - WALLETS_API_ENABLED=true
      - TENANTS_ENABLED=false
      - DISCLOSURE_METHODS_ENABLED=true
      - MULTI_ORG_ENABLED=false
      - MAX_ORGANIZATIONS=100
      - WEBAUTHN_RP_NAME=ZKsync Prividium
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_ORIGIN=http://localhost:3001,http://localhost:3000
      - USER_PANEL_URL=http://localhost:3001
      - WEBAUTHN_REQUIRE_USER_VERIFICATION=false
      - WEBAUTHN_AUTHENTICATOR_ATTACHMENT=platform
      - EXTRA_PUBLIC_CODE_ADDRESSES=0x36615Cf349d7F6344891B1e7CA7C72883F5dc049
      - BUNDLER_ENABLED=true
      - BUNDLER_RPC_URL=http://bundler:4337
      - FAUCET_ENABLED=true
      - FAUCET_OPERATOR_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - FAUCET_CLAIM_AMOUNT_WEI=50000000000000000
      - FAUCET_COOLDOWN_SECONDS=86400 # 24 hours
      - FAUCET_STALE_PENDING_SECONDS=3600 # 1 hour
      - FAUCET_MAX_DAILY_SPEND_WEI=5000000000000000000 # 5 eth
      - FAUCET_TX_TIMEOUT_MS=30000
      - RATE_LIMIT_ENABLED=false
      - RATE_LIMIT_AUTH_MAX=100
      - RATE_LIMIT_PUBLIC_MAX=300
      - RATE_LIMIT_USER_MAX=300
      - RATE_LIMIT_RPC_MAX=1000
      - RATE_LIMIT_M2M_MAX=1000
      - RATE_LIMIT_WINDOW_MS=60000
      - CRYPTO_NATIVE_ADMIN_WALLETS=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      # Allowlist of dev EOAs that bypass the well-known dev wallet block.
      # Production deployments MUST leave this empty. The addresses below are
      # anvil defaults used by seeds (dev/wallet-auth/seed-wallet-auth.sql) and
      # E2E fixtures (packages/e2e-tests/src/utils/constants.ts).
      - KNOWN_DEV_WALLETS_ALLOWLIST=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC,0x90F79bf6EB2c4f870365E785982E1f101E93b906,0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65,0xa0Ee7A142d267C1f36714E4a8F75612F20a79720
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sso-permissions-setup:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./dev/sso-setup:/app
      - sso_setup_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/prividium_api
    command: sh -c "corepack enable && pnpm install && pnpm tsx scripts/setup-permissions.ts"
    depends_on:
      sso-contracts-deployer:
        condition: service_completed_successfully
      prividium-api:
        condition: service_healthy

  auth-server-api:
    image: ghcr.io/matter-labs/sso-auth-server-api:996fbd7-1780065236920
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '3004:3004'
    volumes:
      - ./dev/sso-setup/contracts.env:/contracts.env:ro
    environment:
      - PORT=3004
      - CORS_ORIGINS=http://localhost:3006,http://localhost:3001,http://localhost:3000
      - DEPLOYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - RPC_URL=http://zksyncos:3050
      - CHAIN_1_ID=6565
      - CHAIN_1_RPC_URL=http://zksyncos:3050
      - PRIVIDIUM_MODE=true
      - PRIVIDIUM_API_URL=http://prividium-api:8000
      - PRIVIDIUM_ADMIN_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - PRIVIDIUM_TEMPLATE_KEY=sso-smart-account
      - SSO_AUTH_SERVER_BASE_URL=http://localhost:3006
    entrypoint:
      - /bin/sh
      - -c
      - 'set -a && . /contracts.env && set +a && exec node --experimental-wasm-modules /prod/auth-server-api/dist/index.js'
    depends_on:
      sso-permissions-setup:
        condition: service_completed_successfully

  auth-server:
    image: ghcr.io/matter-labs/sso-auth-server:996fbd7-1780065232708
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '3006:3000'
    volumes:
      - ./dev/sso-setup/contracts.env:/contracts.env:ro
    environment:
      - NUXT_PUBLIC_CHAIN_ID=6565
      - NUXT_PUBLIC_CHAIN_NAME=Prividium Local
      - NUXT_PUBLIC_CHAIN_RPC_URL=http://localhost:5050
      - NUXT_PUBLIC_AUTH_SERVER_API_URL=http://localhost:3004
      - NUXT_PUBLIC_PRIVIDIUM_MODE=true
      - NUXT_PUBLIC_PRIVIDIUM_AUTH_BASE_URL=http://localhost:3001
      - NUXT_PUBLIC_PRIVIDIUM_API_BASE_URL=http://localhost:8000
      - NUXT_PUBLIC_SALT_SERVICE_URL=https://sso-oidc.zksync.dev/salt
      - NUXT_PUBLIC_ZKEY_URL=https://sso-oidc.zksync.dev/zkey
      - NUXT_PUBLIC_WITNESS_WASM_URL=https://sso-oidc.zksync.dev/witness
    command: >
      sh -c "
        export NUXT_PUBLIC_PRIVIDIUM_CLIENT_ID=$$(grep '^SSO_CLIENT_ID=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_GUARDIAN_EXECUTOR_ADDRESS=$$(grep '^SSO_GUARDIAN_EXECUTOR=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_FACTORY_ADDRESS=$$(grep '^SSO_FACTORY=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_EOA_VALIDATOR_ADDRESS=$$(grep '^SSO_EOA_VALIDATOR=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_WEBAUTHN_VALIDATOR_ADDRESS=$$(grep '^SSO_WEBAUTHN_VALIDATOR=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_SESSION_VALIDATOR_ADDRESS=$$(grep '^SSO_SESSION_VALIDATOR=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_BEACON_ADDRESS=$$(grep '^SSO_BEACON=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        export NUXT_PUBLIC_ENTRY_POINT_ADDRESS=$$(grep '^SSO_ENTRY_POINT=' /contracts.env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]') ;
        exec node .output/server/index.mjs
      "
    depends_on:
      sso-permissions-setup:
        condition: service_completed_successfully
      auth-server-api:
        condition: service_started

  user-panel:
    image: quay.io/matterlabs_enterprise/prividium-user-panel:v1.237.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - VITE_OIDC_AUTHORITY=http://localhost:5080/realms/prividium
      - VITE_OIDC_CLIENT_ID=prividium-client
      - VITE_OIDC_REDIRECT_URI=http://localhost:3001/callback
      - VITE_OIDC_POST_LOGOUT_REDIRECT_URI=http://localhost:3001/login
      - VITE_OIDC_BUTTON_TEXT=Sign in with Keycloak
      - VITE_ADMIN_PANEL_REDIRECT_URI=http://localhost:3000/callback
      - VITE_AUTH_METHODS=oidc,crypto_native
      - VITE_CHAIN_ID=6565
      - VITE_CHAIN_NAME=Prividium™ Local
      - VITE_WALLETS_ENABLED=true
      - VITE_FAUCET_ENABLED=true
      - VITE_BRIDGING_ENABLED=true
      - VITE_WITHDRAWAL_ENABLED=true
      - VITE_L1_RPC_URL=http://localhost:5010
      - VITE_L1_CHAIN_ID=31337
      - VITE_L1_CHAIN_NAME=Anvil Localhost
      - VITE_PRIVIDIUM_API_URL=http://localhost:8000
      - VITE_EXPLORER_URL=http://localhost:3010
      - VITE_ADMIN_PANEL_URL=http://localhost:3000
      - VITE_REOWN_PROJECT_ID=

      - PORT=3000
    depends_on:
      - prividium-api
    ports:
      - '3001:3000'
